loadImage(imageSelect.value);

imageSelect.addEventListener("change", () => {
    loadImage(imageSelect.value);
});

slider.addEventListener("input", () => {
    label.textContent = slider.value;
    reconstruct(parseInt(slider.value));
});

function loadImage(filename) {

    const img = new Image();

    img.onload = () => {

        width = img.width;
        height = img.height;

        originalCanvas.width = width;
        originalCanvas.height = height;

        reconCanvas.width = width;
        reconCanvas.height = height;

        octx.drawImage(img, 0, 0);

        const imageData =
            octx.getImageData(0,0,width,height);

        const gray = imageToGray(imageData);

        computeFFT(gray);

        reconstruct(parseInt(slider.value));
    };

    img.src = images[imageSelect.value];
}

function imageToGray(imageData) {

    const gray = [];

    for(let y=0; y<height; y++) {

        gray[y] = [];

        for(let x=0; x<width; x++) {

            const idx = (y*width + x)*4;

            const r = imageData.data[idx];
            const g = imageData.data[idx+1];
            const b = imageData.data[idx+2];

            gray[y][x] =
                0.299*r +
                0.587*g +
                0.114*b;
        }
    }

    return gray;
}

function computeFFT(gray) {

    // Allocate flat arrays
    const realData = new Float64Array(width * height);
    const imagData = new Float64Array(width * height);

    // Copy grayscale image into real part
    for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
            realData[y * width + x] = gray[y][x];
        }
    }
    console.log(typeof ndarray);
    console.log(ndarray);
    fftReal = ndarray(realData, [height, width]);
    fftImag = ndarray(imagData, [height, width]);

    // Forward FFT (in-place)
    fft(1, fftReal, fftImag);

    coeffs = [];

    for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {

            const re = fftReal.get(y, x);
            const im = fftImag.get(y, x);

            coeffs.push({
                x: x,
                y: y,
                re: re,
                im: im,
                mag: Math.hypot(re, im)
            });
        }
    }

    coeffs.sort((a, b) => b.mag - a.mag);

    console.log("coeffs:", coeffs.length);
    console.log("largest:", coeffs[0]);

    slider.max = coeffs.length;
}

function reconstruct(N) {


    const re = [];
    const im = [];

    for(let y=0; y<height; y++) {

        re[y] = new Float64Array(width);
        im[y] = new Float64Array(width);
    }

    for(let i=0; i<N; i++) {

        const c = coeffs[i];

        re[c.y][c.x] = c.re;
        im[c.y][c.x] = c.im;
    }

    const recon = ifft2d(re, im);

    displayImage(recon);
}
function displayImage(img) {

    const imageData =
        rctx.createImageData(width,height);

    let minVal = Infinity;
    let maxVal = -Infinity;

    for(let y=0; y<height; y++) {
        for(let x=0; x<width; x++) {

            minVal = Math.min(minVal,img[y][x]);
            maxVal = Math.max(maxVal,img[y][x]);
        }
    }

    const range = maxVal - minVal;

    for(let y=0; y<height; y++) {

        for(let x=0; x<width; x++) {

            let val =
                (img[y][x]-minVal)/range;

            val = Math.round(val*255);

            const idx =
                (y*width+x)*4;

            imageData.data[idx] = val;
            imageData.data[idx+1] = val;
            imageData.data[idx+2] = val;
            imageData.data[idx+3] = 255;
        }
    }

    rctx.putImageData(imageData,0,0);
}
