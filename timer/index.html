<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Co-working Timer</title>

<style>
body{
    font-family:system-ui;
    text-align:center;
    margin-top:60px;
    background:#f6f6f6;
}

#timer{
    font-size:90px;
    font-weight:bold;
}

#phase{
    font-size:36px;
    margin-bottom:20px;
}

button{
    padding:10px 20px;
    font-size:18px;
    margin:5px;
}

input{
    width:70px;
    font-size:18px;
}
</style>

</head>
<body>

<h1>Co-working Timer</h1>

<div id="phase"></div>
<div id="timer"></div>

<div style="margin-top:30px;">
Work
<input id="work" type="number" value="50">

Break
<input id="break" type="number" value="10">

<button id="startBtn">Start New Session</button>
</div>

<p>
Share this link:
</p>

<input id="shareLink" style="width:90%;" readonly>

<script>

const params = new URLSearchParams(location.search);

let work = Number(params.get("work")) || 50;
let breakTime = Number(params.get("break")) || 10;
let start = Number(params.get("start"));

document.getElementById("work").value = work;
document.getElementById("break").value = breakTime;

function startSession(){

    work = Number(document.getElementById("work").value);
    breakTime = Number(document.getElementById("break").value);

    start = Date.now();

    const url =
        location.origin +
        location.pathname +
        "?start=" + start +
        "&work=" + work +
        "&break=" + breakTime;

    history.replaceState({}, "", url);

    document.getElementById("shareLink").value = url;

}

document.getElementById("startBtn").onclick = startSession;

function update(){

    if(!start){
        document.getElementById("phase").textContent = "Not started";
        document.getElementById("timer").textContent = "--:--";
        return;
    }

    const workMs = work*60*1000;
    const breakMs = breakTime*60*1000;

    const cycle = workMs + breakMs;

    const elapsed = Date.now()-start;

    const position = ((elapsed % cycle)+cycle)%cycle;

    let remaining;
    let phase;

    if(position < workMs){
        phase = "💻 Work";
        remaining = workMs-position;
    }else{
        phase = "☕ Break";
        remaining = cycle-position;
    }

    const totalSeconds = Math.ceil(remaining/1000);

    const minutes = Math.floor(totalSeconds/60);
    const seconds = totalSeconds%60;

    document.getElementById("phase").textContent = phase;

    document.getElementById("timer").textContent =
        String(minutes).padStart(2,"0") + ":" +
        String(seconds).padStart(2,"0");

    document.getElementById("shareLink").value =
        location.href;
}

setInterval(update,250);
update();

if(start){
    document.getElementById("shareLink").value = location.href;
}

</script>

</body>
</html>
