<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Receptive Field Demo</title>

<style>

:root{
  --bg:#0d0f14;
  --bg-grad:#11141c;
  --panel:#161922;
  --panel-2:#12141b;
  --border:#262b38;
  --border-soft:#1e222c;
  --text:#ffffff;
  --muted:#aab0c0;
  --muted-dim:#7d8293;
  --accent:#6ee7d8;
  --accent-dim:#3d7d76;
  color-scheme:dark;
}

*{box-sizing:border-box;}

body{
  font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background:
    radial-gradient(1200px 600px at 15% -10%, var(--bg-grad), transparent),
    var(--bg);
  color:var(--text);
  margin:0;
  padding:32px 28px 56px;
}

header{
  max-width:720px;
  margin:0 auto 28px;
}

.eyebrow{
  font-size:11px;
  letter-spacing:0.2em;
  text-transform:uppercase;
  color:var(--accent);
  margin-bottom:10px;
  font-weight:600;
}

h1{
  font-weight:700;
  font-size:26px;
  letter-spacing:-0.01em;
  margin:0 0 8px;
  color:var(--text);
}

.subtitle{
  color:var(--muted);
  font-size:13px;
  line-height:1.55;
}

.layout{
  max-width:720px;
  margin:0 auto;
  display:flex;
  gap:20px;
  align-items:flex-start;
}

.leftCol{
  flex:0 0 260px;
  display:flex;
  flex-direction:column;
  gap:20px;
}

.rightCol{
  flex:1 1 380px;
  min-width:280px;
}

.card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:12px;
  padding:18px 20px 20px;
}

.cardHead{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  margin-bottom:12px;
}

.cardTitle{
  font-size:10px;
  letter-spacing:0.16em;
  text-transform:uppercase;
  color:var(--muted);
  font-weight:600;
}

.cardHint{
  font-size:11px;
  color:var(--muted-dim);
}

.canvasFrame{
  width:100%;
  border-radius:8px;
  overflow:hidden;
  border:1px solid var(--border-soft);
  line-height:0;
}

canvas{
  display:block;
  width:100%;
  height:auto;
  background:var(--panel-2);
}

#stimCanvas{
  cursor:crosshair;
}

.controlsGrid{
  display:grid;
  grid-template-columns:1fr;
  gap:14px;
}

.controlItem{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.controlLabel{
  font-size:10px;
  letter-spacing:0.12em;
  text-transform:uppercase;
  color:var(--muted);
  font-weight:600;
}

.controlLabel .val{
  color:var(--accent);
  text-transform:none;
  letter-spacing:0;
  font-weight:700;
  font-size:11px;
}

select{
  width:100%;
  font-family:inherit;
  font-size:13px;
  color:var(--text);
  background:var(--panel-2);
  border:1px solid var(--border);
  border-radius:6px;
  padding:8px 10px;
}

select:focus-visible,
input[type="range"]:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:2px;
}

input[type="range"]{
  width:100%;
  accent-color:var(--accent);
}

@media (max-width:640px){
  body{padding:24px 16px 48px;}
  h1{font-size:22px;}
  .card{padding:16px;}
  .layout{flex-direction:column;}
  .leftCol{flex:1 1 auto;width:100%;}
  .rightCol{flex:1 1 auto;width:100%;min-width:0;}
}

</style>
</head>

<body>

<header>
  <div class="eyebrow">Vision Science · Receptive Fields</div>
  <h1>Receptive Field Demo</h1>
  <p class="subtitle">Move your mouse to present a stimulus over a simulated receptive field. The response rate it drives is shown as a spike train below.</p>
</header>

<div class="layout">

<div class="leftCol">

<div class="card">
  <div class="cardHead">
    <span class="cardTitle">Controls</span>
  </div>
  <div class="controlsGrid">

    <div class="controlItem">
      <label class="controlLabel" for="rfType">Receptive Field</label>
      <select id="rfType">
        <option value="onCenter">On-center / Off-surround</option>
        <option value="offCenter">Off-center / On-surround</option>
        <option value="simple">Simple Cell (bar)</option>
      </select>
    </div>

    <div class="controlItem">
      <label class="controlLabel" for="stimType">Stimulus</label>
      <select id="stimType">
        <option value="spotWhite">Spot (white)</option>
        <option value="spotBlack">Spot (black)</option>
        <option value="barWhite">Bar (white)</option>
        <option value="barBlack">Bar (black)</option>
        <option value="ringWhite">Ring (white)</option>
        <option value="ringBlack">Ring (black)</option>
      </select>
    </div>

    <div class="controlItem">
      <label class="controlLabel" for="sizeSlider">Size <span class="val" id="sizeVal">90</span>px</label>
      <input type="range" id="sizeSlider" min="30" max="200" value="90">
    </div>

    <div class="controlItem">
      <label class="controlLabel" for="angleSlider">Orientation <span class="val" id="angleVal">0</span>°</label>
      <input type="range" id="angleSlider" min="0" max="180" value="0">
    </div>

  </div>
</div>

<div class="card">
  <div class="cardHead">
    <span class="cardTitle">Spike Train</span>
    <span class="cardHint">simulated response</span>
  </div>
  <div class="canvasFrame">
    <canvas id="spikeCanvas" width="400" height="120"></canvas>
  </div>
</div>

</div>

<div class="rightCol">

<div class="card">
  <div class="cardHead">
    <span class="cardTitle">Stimulus Field</span>
    <span class="cardHint">move mouse to position</span>
  </div>
  <div class="canvasFrame">
    <canvas id="stimCanvas" width="400" height="400"></canvas>
  </div>
</div>

</div>

</div>

<script>

// orientation preference of the simple-cell receptive field (radians);
// randomized fresh each time "Simple Cell" is selected, see below
let RF_ORIENTATION = 0;

// shape of the simple cell's Gabor receptive field. GABOR_SIGMA_ACROSS and
// GABOR_DIVISOR (which sets the grating's wavelength, 2*pi*GABOR_DIVISOR)
// are chosen together so the ON and OFF lobes have comparable weight -- if
// the envelope is much narrower than the grating's wavelength, the OFF
// flanks barely register and the kernel ends up net-positive, so a
// stimulus covering the *entire* RF would score as excitatory instead of
// properly cancelling out. GABOR_SIGMA_ALONG is larger than
// GABOR_SIGMA_ACROSS, elongating the RF along its own orientation like a
// real bar detector.
const GABOR_SIGMA_ACROSS = 52;
const GABOR_SIGMA_ALONG = 65;
const GABOR_DIVISOR = 12;

const STIM_SIZE = 400;
const SPIKE_W = 400;
const SPIKE_H = 120;

// half-height of the bar stimulus -- shared by drawStimulus (drawing) and
// isInsideStimulus (hit-testing) so the two always agree on the bar's extent.
// Kept narrow enough to fit within one lobe of the simple cell's grating
// (see GABOR_SIGMA_ACROSS / the grating wavelength above) -- a bar much
// wider than that spans multiple ON/OFF lobes and partially cancels itself
// out even when perfectly oriented.
const BAR_HALF_HEIGHT = 15;

// ring stimulus's inner radius as a fraction of its outer radius (the
// Size slider) -- shared by drawStimulus and isInsideStimulus so they
// always agree on the ring's thickness
const RING_INNER_RATIO = 0.5;

const stimCanvas = document.getElementById("stimCanvas");
const stimCtx = stimCanvas.getContext("2d");

const spikeCanvas = document.getElementById("spikeCanvas");
const spikeCtx = spikeCanvas.getContext("2d");

function setupHiDPI(canvas, ctx, w, h){
let dpr = window.devicePixelRatio || 1;
canvas.width = w*dpr;
canvas.height = h*dpr;
ctx.setTransform(dpr,0,0,dpr,0,0);
}

setupHiDPI(stimCanvas, stimCtx, STIM_SIZE, STIM_SIZE);
setupHiDPI(spikeCanvas, spikeCtx, SPIKE_W, SPIKE_H);

let mouse = {x: 200, y: 200};
let spikes = [];

// live readouts for the sliders
const sizeSlider = document.getElementById("sizeSlider");
const angleSlider = document.getElementById("angleSlider");
const sizeVal = document.getElementById("sizeVal");
const angleVal = document.getElementById("angleVal");

sizeSlider.addEventListener("input", () => sizeVal.textContent = sizeSlider.value);
angleSlider.addEventListener("input", () => angleVal.textContent = angleSlider.value);

// give the simple cell a fresh, random orientation preference every time
// it's chosen, rather than always defaulting to the same axis
const rfTypeSelect = document.getElementById("rfType");

function randomizeRFOrientation() {
  RF_ORIENTATION = Math.random() * Math.PI; // a grating's orientation repeats every 180°
}

rfTypeSelect.addEventListener("change", () => {
  if (rfTypeSelect.value === "simple") {
    randomizeRFOrientation();
  }
});

// Mouse control
stimCanvas.addEventListener("mousemove", e => {
  const rect = stimCanvas.getBoundingClientRect();

  const scaleX = STIM_SIZE / rect.width;
  const scaleY = STIM_SIZE / rect.height;

  mouse.x = (e.clientX - rect.left) * scaleX;
  mouse.y = (e.clientY - rect.top) * scaleY;
});

// Draw stimulus
function drawStimulus() {
  // Neutral grey field -- gives white and black stimuli equal, symmetric
  // contrast to work with, above and below the field's own luminance
  stimCtx.fillStyle = "#808080";
  stimCtx.fillRect(0, 0, STIM_SIZE, STIM_SIZE);

  const stimType = document.getElementById("stimType").value;
  const isBar = stimType.startsWith("bar");
  const isRing = stimType.startsWith("ring");
  const isSpot = stimType.startsWith("spot");
  const isWhite = stimType.endsWith("White");

  const size = parseInt(document.getElementById("sizeSlider").value);
  const angle = document.getElementById("angleSlider").value * Math.PI/180;

  stimCtx.fillStyle = isWhite ? "white" : "black";

  if (isSpot) {
    stimCtx.beginPath();
    stimCtx.arc(mouse.x, mouse.y, size, 0, Math.PI * 2);
    stimCtx.fill();
  }

  if (isRing) {
    const inner = size * RING_INNER_RATIO;
    stimCtx.beginPath();
    stimCtx.arc(mouse.x, mouse.y, size, 0, Math.PI * 2);
    stimCtx.arc(mouse.x, mouse.y, inner, 0, Math.PI * 2, true);
    stimCtx.fill("evenodd");
  }

  if (isBar) {
    stimCtx.save();
    stimCtx.translate(mouse.x, mouse.y);
    stimCtx.rotate(angle);
    stimCtx.fillRect(-size, -BAR_HALF_HEIGHT, size * 2, BAR_HALF_HEIGHT * 2);
    stimCtx.restore();
  }
}

// Standard-normal random sample (Box-Muller transform). Used to draw
// sample points proportional to the simple cell's own Gaussian envelope,
// rather than uniformly over a big window -- far more sample-efficient,
// since most of a uniform window falls where the RF has ~0 sensitivity.
function gaussianRandom() {
  let u = 0, v = 0;
  while (u === 0) u = Math.random();
  while (v === 0) v = Math.random();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

function computeResponse(rfType, cx, cy, mouse) {

  let response = 0;

  // --- CENTER-SURROUND ---
  if (rfType === "onCenter" || rfType === "offCenter") {

    let centerSum = 0;
    let surroundSum = 0;

    let centerMax = 0;
    let surroundMax = 0;

    const samples = 300;

    for (let i = 0; i < samples; i++) {

      let center = 0;
      let surround = 0;

      const x = cx + (Math.random() - 0.5) * 200;
      const y = cy + (Math.random() - 0.5) * 200;

      const dx = x - cx;
      const dy = y - cy;
      const dist2 = dx*dx + dy*dy;

      const r2 = dist2;

      // --- define annulus RF ---
      if (r2 < 30*30) {
        center = Math.exp(-dist2 / 800);
      }

      if (r2 >= 30*30 && r2 < 80*80) {
        surround = Math.exp(-dist2 / 3000);
      }

      const stim = isInsideStimulus(x, y);

      if (center > 0) {
        centerSum += center * stim;
        centerMax += center;
      }

      if (surround > 0) {
        surroundSum += surround * stim;
        surroundMax += surround;
      }

    }

    // --- normalize each region independently ---
    let centerNorm = 0;
    let surroundNorm = 0;

    if (centerMax > 0) {
      centerNorm = centerSum / centerMax;
    }

    if (surroundMax > 0) {
      surroundNorm = surroundSum / surroundMax;
    }

    // --- assign excitation/inhibition ---
    let excitation, inhibition;

    if (rfType === "onCenter") {
      excitation = centerNorm;
      inhibition = surroundNorm;
    } else { // offCenter
      excitation = surroundNorm;
      inhibition = centerNorm;
    }

    // --- balanced response ---
    const baseline = 3;
    const gainE = 15;
    const gainI = 15;

    response = baseline + gainE * excitation - gainI * inhibition;
  }

  // --- SIMPLE CELL ---
  if (rfType === "simple") {

    // elongated (anisotropic) Gabor envelope: the grating oscillates along
    // "proj", so the envelope must be NARROW along proj (or you'd see many
    // repeated cycles instead of one clean bar) and WIDE along "perp" --
    // that's the direction parallel to the bar itself, which is what makes
    // the RF a long, narrow bar detector rather than a circular blob.
    //
    // GABOR_SIGMA_ACROSS and the grating's wavelength (2*pi*GABOR_DIVISOR)
    // are chosen together so the ON and OFF lobes have comparable weight:
    // if the envelope is much narrower than the grating's wavelength, the
    // OFF flanks barely register and the kernel ends up net-positive, so a
    // stimulus covering the *entire* RF still scores as excitatory instead
    // of cancelling out (this was the actual bug).

    // Integrate the RF's signed sensitivity map against the stimulus's
    // actual footprint (like the center-surround cell already does),
    // rather than sampling the RF's weight at a single point (the mouse
    // position) and ignoring the stimulus's size entirely. Sample points
    // proportional to the envelope itself (importance sampling) rather
    // than uniformly over a big window -- far more efficient, since a
    // uniform window mostly lands where the RF has ~0 sensitivity.
    const samples = 500;

    let weightedSum = 0;
    let weightNorm = 0;

    for (let i = 0; i < samples; i++) {

      const proj = gaussianRandom() * GABOR_SIGMA_ACROSS;
      const perp = gaussianRandom() * GABOR_SIGMA_ALONG;

      const x = cx + proj * Math.cos(RF_ORIENTATION) - perp * Math.sin(RF_ORIENTATION);
      const y = cy + proj * Math.sin(RF_ORIENTATION) + perp * Math.cos(RF_ORIENTATION);

      // signed RF sensitivity at this point -- positive in ON subregions,
      // negative in OFF subregions (the envelope itself is already baked
      // into the sampling density, so it isn't multiplied in again here)
      const weight = Math.cos(proj / GABOR_DIVISOR);

      // signed stimulus contrast at this point: +1 white, -1 black, 0 outside
      const stim = isInsideStimulus(x, y);

      weightedSum += weight * stim;
      weightNorm += Math.abs(weight);
    }

    const drive = weightNorm > 0 ? weightedSum / weightNorm : 0;

    const gain = 15;
    const baseline = 0.5;

    response = baseline + gain * drive;
  }

  // --- clamp ---
  return Math.max(0, response);
}

// Generate spikes (Poisson-like)
function updateSpikes(rate) {
  const dt = 0.016; // ~60 FPS

  // Proper Poisson spike probability
  const p = rate * dt;

  if (Math.random() < p) {
    spikes.push(0);
  }

  // Move spikes across screen
  spikes = spikes
    .map(s => s + 2)
    .filter(s => s < SPIKE_W);
}

// Draw spike train
function drawSpikes() {
  spikeCtx.clearRect(0, 0, SPIKE_W, SPIKE_H);

  spikeCtx.fillStyle = "#12141b";
  spikeCtx.fillRect(0, 0, SPIKE_W, SPIKE_H);

  spikeCtx.strokeStyle = "#6ee7d8";
  spikeCtx.lineWidth = 2;

  spikes.forEach(s => {
    spikeCtx.beginPath();
    spikeCtx.moveTo(SPIKE_W - s, 0);
    spikeCtx.lineTo(SPIKE_W - s, SPIKE_H);
    spikeCtx.stroke();
  });
}

function drawReceptiveField(rfType,cx,cy) {

  stimCtx.lineWidth = 2;
  stimCtx.font = "16px sans-serif";
  stimCtx.textAlign = "center";
  stimCtx.textBaseline = "middle";

  if (rfType === "onCenter" || rfType === "offCenter") {

    // CENTER
    stimCtx.beginPath();
    stimCtx.arc(cx, cy, 40, 0, Math.PI * 2);
    stimCtx.strokeStyle = rfType === "onCenter" ? "lime" : "red";
    stimCtx.stroke();

    // SURROUND
    stimCtx.beginPath();
    stimCtx.arc(cx, cy, 80, 0, Math.PI * 2);
    stimCtx.strokeStyle = rfType === "onCenter" ? "red" : "lime";
    stimCtx.stroke();

    // + / - labels
    stimCtx.fillStyle = "white";
    stimCtx.fillText(
      rfType === "onCenter" ? "+" : "-",
      cx,
      cy
    );

    stimCtx.fillText(
      rfType === "onCenter" ? "-" : "+",
      cx + 60,
      cy
    );
  }

  if (rfType === "simple") {

    stimCtx.save();
    stimCtx.translate(cx, cy);
    stimCtx.rotate(RF_ORIENTATION);

    // narrow along the grating's oscillation axis (x, locally), long
    // along the bar's own axis (y, locally) -- matches the anisotropic
    // envelope in computeResponse. bandWidth/bandHeight are kept
    // proportional to GABOR_SIGMA_ACROSS/GABOR_SIGMA_ALONG so this outline
    // never drifts out of sync with the actual response math again.
    const bandWidth = 44;
    const bandHeight = 180;
    const halfH = bandHeight / 2;

    stimCtx.lineWidth = 2;
    stimCtx.fillStyle = "white";

    // Left OFF region (outline only)
    stimCtx.strokeStyle = "red";
    stimCtx.strokeRect(-1.5*bandWidth, -halfH, bandWidth, bandHeight);
    stimCtx.fillText("-", -bandWidth, 0);

    // Center ON region (outline only)
    stimCtx.strokeStyle = "lime";
    stimCtx.strokeRect(-0.5*bandWidth, -halfH, bandWidth, bandHeight);
    stimCtx.fillText("+", 0, 0);

    // Right OFF region (outline only)
    stimCtx.strokeStyle = "red";
    stimCtx.strokeRect(0.5*bandWidth, -halfH, bandWidth, bandHeight);
    stimCtx.fillText("-", bandWidth, 0);

    stimCtx.restore();
  }
}

function isInsideStimulus(x, y) {
  const stimType = document.getElementById("stimType").value;
  const isBar = stimType.startsWith("bar");
  const isRing = stimType.startsWith("ring");
  const contrastSign = stimType.endsWith("White") ? 1 : -1;

  const size = parseInt(document.getElementById("sizeSlider").value);
  const angle = document.getElementById("angleSlider").value * Math.PI/180;

  const dx = x - mouse.x;
  const dy = y - mouse.y;
  const dist2 = dx*dx + dy*dy;

  let inside = false;

  if (isRing) {
    const inner = size * RING_INNER_RATIO;
    inside = dist2 <= size*size && dist2 >= inner*inner;
  } else if (isBar) {
    // rotate point into bar coordinates
    const xr = dx * Math.cos(-angle) - dy * Math.sin(-angle);
    const yr = dx * Math.sin(-angle) + dy * Math.cos(-angle);

    inside = Math.abs(xr) < size && Math.abs(yr) < BAR_HALF_HEIGHT;
  } else {
    inside = dist2 <= size*size;
  }

  return inside ? contrastSign : 0;
}

function loop() {

  const rfType = document.getElementById("rfType").value;
  const cx = STIM_SIZE / 2;
  const cy = STIM_SIZE / 2;

  drawStimulus();
  drawReceptiveField(rfType,cx,cy);

  const rate = computeResponse(rfType,cx,cy,mouse);
  updateSpikes(rate);
  drawSpikes();

  requestAnimationFrame(loop);
}

loop();

</script>

</body>
</html>
