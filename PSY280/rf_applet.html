<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Receptive Field Demo</title>

<style>

:root{
  --bg:#0d0f14;
  --bg-grad:#11141c;
  --panel:#161922;
  --panel-2:#12141b;
  --border:#262b38;
  --border-soft:#1e222c;
  --text:#ffffff;
  --muted:#aab0c0;
  --muted-dim:#7d8293;
  --accent:#6ee7d8;
  --accent-dim:#3d7d76;
  color-scheme:dark;
}

*{box-sizing:border-box;}

body{
  font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background:
    radial-gradient(1200px 600px at 15% -10%, var(--bg-grad), transparent),
    var(--bg);
  color:var(--text);
  margin:0;
  padding:32px 28px 56px;
}

header{
  max-width:460px;
  margin:0 auto 28px;
}

.eyebrow{
  font-size:11px;
  letter-spacing:0.2em;
  text-transform:uppercase;
  color:var(--accent);
  margin-bottom:10px;
  font-weight:600;
}

h1{
  font-weight:700;
  font-size:26px;
  letter-spacing:-0.01em;
  margin:0 0 8px;
  color:var(--text);
}

.subtitle{
  color:var(--muted);
  font-size:13px;
  line-height:1.55;
}

.stack{
  max-width:460px;
  margin:0 auto;
  display:flex;
  flex-direction:column;
  gap:20px;
}

.card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:12px;
  padding:18px 20px 20px;
}

.cardHead{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  margin-bottom:12px;
}

.cardTitle{
  font-size:10px;
  letter-spacing:0.16em;
  text-transform:uppercase;
  color:var(--muted);
  font-weight:600;
}

.cardHint{
  font-size:11px;
  color:var(--muted-dim);
}

.canvasFrame{
  width:100%;
  border-radius:8px;
  overflow:hidden;
  border:1px solid var(--border-soft);
  line-height:0;
}

canvas{
  display:block;
  width:100%;
  height:auto;
  background:var(--panel-2);
}

#stimCanvas{
  cursor:crosshair;
}

.controlsGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px 20px;
}

.controlItem{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.controlLabel{
  font-size:10px;
  letter-spacing:0.12em;
  text-transform:uppercase;
  color:var(--muted);
  font-weight:600;
}

.controlLabel .val{
  color:var(--accent);
  text-transform:none;
  letter-spacing:0;
  font-weight:700;
  font-size:11px;
}

select{
  width:100%;
  font-family:inherit;
  font-size:13px;
  color:var(--text);
  background:var(--panel-2);
  border:1px solid var(--border);
  border-radius:6px;
  padding:8px 10px;
}

select:focus-visible,
input[type="range"]:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:2px;
}

input[type="range"]{
  width:100%;
  accent-color:var(--accent);
}

@media (max-width:520px){
  body{padding:24px 16px 48px;}
  h1{font-size:22px;}
  .card{padding:16px;}
  .controlsGrid{grid-template-columns:1fr;}
}

</style>
</head>

<body>

<header>
  <div class="eyebrow">Vision Science · Receptive Fields</div>
  <h1>Receptive Field Demo</h1>
  <p class="subtitle">Move your mouse to present a stimulus over a simulated receptive field. The response rate it drives is shown as a spike train below.</p>
</header>

<div class="stack">

<div class="card">
  <div class="cardHead">
    <span class="cardTitle">Controls</span>
  </div>
  <div class="controlsGrid">

    <div class="controlItem">
      <label class="controlLabel" for="rfType">Receptive Field</label>
      <select id="rfType">
        <option value="onCenter">On-center / Off-surround</option>
        <option value="offCenter">Off-center / On-surround</option>
        <option value="simple">Simple Cell (bar)</option>
      </select>
    </div>

    <div class="controlItem">
      <label class="controlLabel" for="stimType">Stimulus</label>
      <select id="stimType">
        <option value="spot">Spot</option>
        <option value="bar">Bar</option>
      </select>
    </div>

    <div class="controlItem">
      <label class="controlLabel" for="sizeSlider">Size <span class="val" id="sizeVal">30</span>px</label>
      <input type="range" id="sizeSlider" min="5" max="100" value="30">
    </div>

    <div class="controlItem">
      <label class="controlLabel" for="angleSlider">Orientation <span class="val" id="angleVal">0</span>°</label>
      <input type="range" id="angleSlider" min="0" max="180" value="0">
    </div>

  </div>
</div>

<div class="card">
  <div class="cardHead">
    <span class="cardTitle">Stimulus Field</span>
    <span class="cardHint">move mouse to position</span>
  </div>
  <div class="canvasFrame">
    <canvas id="stimCanvas" width="400" height="400"></canvas>
  </div>
</div>

<div class="card">
  <div class="cardHead">
    <span class="cardTitle">Spike Train</span>
    <span class="cardHint">simulated response</span>
  </div>
  <div class="canvasFrame">
    <canvas id="spikeCanvas" width="400" height="120"></canvas>
  </div>
</div>

</div>

<script>

// fixed orientation of the simple-cell receptive field (horizontal),
// independent of the stimulus bar's own orientation slider
const RF_ORIENTATION = 0;

const STIM_SIZE = 400;
const SPIKE_W = 400;
const SPIKE_H = 120;

const stimCanvas = document.getElementById("stimCanvas");
const stimCtx = stimCanvas.getContext("2d");

const spikeCanvas = document.getElementById("spikeCanvas");
const spikeCtx = spikeCanvas.getContext("2d");

function setupHiDPI(canvas, ctx, w, h){
let dpr = window.devicePixelRatio || 1;
canvas.width = w*dpr;
canvas.height = h*dpr;
ctx.setTransform(dpr,0,0,dpr,0,0);
}

setupHiDPI(stimCanvas, stimCtx, STIM_SIZE, STIM_SIZE);
setupHiDPI(spikeCanvas, spikeCtx, SPIKE_W, SPIKE_H);

let mouse = {x: 200, y: 200};
let spikes = [];

// live readouts for the sliders
const sizeSlider = document.getElementById("sizeSlider");
const angleSlider = document.getElementById("angleSlider");
const sizeVal = document.getElementById("sizeVal");
const angleVal = document.getElementById("angleVal");

sizeSlider.addEventListener("input", () => sizeVal.textContent = sizeSlider.value);
angleSlider.addEventListener("input", () => angleVal.textContent = angleSlider.value);

// Mouse control
stimCanvas.addEventListener("mousemove", e => {
  const rect = stimCanvas.getBoundingClientRect();

  const scaleX = STIM_SIZE / rect.width;
  const scaleY = STIM_SIZE / rect.height;

  mouse.x = (e.clientX - rect.left) * scaleX;
  mouse.y = (e.clientY - rect.top) * scaleY;
});

// Draw stimulus
function drawStimulus() {
  // Clear + dark instrument background
  stimCtx.fillStyle = "#12141b";
  stimCtx.fillRect(0, 0, STIM_SIZE, STIM_SIZE);

  const stimType = document.getElementById("stimType").value;
  const size = parseInt(document.getElementById("sizeSlider").value);
  const angle = document.getElementById("angleSlider").value * Math.PI/180;

  stimCtx.fillStyle = "white";

  if (stimType === "spot") {
    stimCtx.beginPath();
    stimCtx.arc(mouse.x, mouse.y, size, 0, Math.PI * 2);
    stimCtx.fill();
  }

  if (stimType === "bar") {
    stimCtx.save();
    stimCtx.translate(mouse.x, mouse.y);
    stimCtx.rotate(angle);
    stimCtx.fillRect(-size, -6, size * 2, 12);
    stimCtx.restore();
  }
}

function computeResponse(rfType, cx, cy, mouse) {

  let response = 0;

  // --- CENTER-SURROUND ---
  if (rfType === "onCenter" || rfType === "offCenter") {

    let centerSum = 0;
    let surroundSum = 0;

    let centerMax = 0;
    let surroundMax = 0;

    const samples = 300;

    for (let i = 0; i < samples; i++) {

      let center = 0;
      let surround = 0;

      const x = cx + (Math.random() - 0.5) * 200;
      const y = cy + (Math.random() - 0.5) * 200;

      const dx = x - cx;
      const dy = y - cy;
      const dist2 = dx*dx + dy*dy;

      const r2 = dist2;

      // --- define annulus RF ---
      if (r2 < 30*30) {
        center = Math.exp(-dist2 / 800);
      }

      if (r2 >= 30*30 && r2 < 80*80) {
        surround = Math.exp(-dist2 / 3000);
      }

      const stim = isInsideStimulus(x, y) ? 1 : 0;

      if (center > 0) {
        centerSum += center * stim;
        centerMax += center;
      }

      if (surround > 0) {
        surroundSum += surround * stim;
        surroundMax += surround;
      }

    }

    // --- normalize each region independently ---
    let centerNorm = 0;
    let surroundNorm = 0;

    if (centerMax > 0) {
      centerNorm = centerSum / centerMax;
    }

    if (surroundMax > 0) {
      surroundNorm = surroundSum / surroundMax;
    }

    // --- assign excitation/inhibition ---
    let excitation, inhibition;

    if (rfType === "onCenter") {
      excitation = centerNorm;
      inhibition = surroundNorm;
    } else { // offCenter
      excitation = surroundNorm;
      inhibition = centerNorm;
    }

    // --- balanced response ---
    const baseline = 5;
    const gainE = 15;
    const gainI = 15;

    response = baseline + gainE * excitation - gainI * inhibition;
  }

  // --- SIMPLE CELL ---
  if (rfType === "simple") {

    const dx = mouse.x - cx;
    const dy = mouse.y - cy;

    const proj = dx * Math.cos(RF_ORIENTATION) + dy * Math.sin(RF_ORIENTATION);

    const envelope = Math.exp(-(dx*dx + dy*dy) / 3000);
    const grating = Math.cos(proj / 12);

    const gain = 12;
    const baseline = 0.5;

    response = baseline + gain * envelope * grating;
  }

  // --- clamp ---
  return Math.max(0, response);
}

// Generate spikes (Poisson-like)
function updateSpikes(rate) {
  const dt = 0.016; // ~60 FPS

  // Proper Poisson spike probability
  const p = rate * dt;

  if (Math.random() < p) {
    spikes.push(0);
  }

  // Move spikes across screen
  spikes = spikes
    .map(s => s + 2)
    .filter(s => s < SPIKE_W);
}

// Draw spike train
function drawSpikes() {
  spikeCtx.clearRect(0, 0, SPIKE_W, SPIKE_H);

  spikeCtx.fillStyle = "#12141b";
  spikeCtx.fillRect(0, 0, SPIKE_W, SPIKE_H);

  spikeCtx.strokeStyle = "#6ee7d8";
  spikeCtx.lineWidth = 2;

  spikes.forEach(s => {
    spikeCtx.beginPath();
    spikeCtx.moveTo(SPIKE_W - s, 0);
    spikeCtx.lineTo(SPIKE_W - s, SPIKE_H);
    spikeCtx.stroke();
  });
}

function drawReceptiveField(rfType,cx,cy) {

  stimCtx.lineWidth = 2;
  stimCtx.font = "16px sans-serif";
  stimCtx.textAlign = "center";
  stimCtx.textBaseline = "middle";

  if (rfType === "onCenter" || rfType === "offCenter") {

    // CENTER
    stimCtx.beginPath();
    stimCtx.arc(cx, cy, 40, 0, Math.PI * 2);
    stimCtx.strokeStyle = rfType === "onCenter" ? "lime" : "red";
    stimCtx.stroke();

    // SURROUND
    stimCtx.beginPath();
    stimCtx.arc(cx, cy, 80, 0, Math.PI * 2);
    stimCtx.strokeStyle = rfType === "onCenter" ? "red" : "lime";
    stimCtx.stroke();

    // + / - labels
    stimCtx.fillStyle = "white";
    stimCtx.fillText(
      rfType === "onCenter" ? "+" : "-",
      cx,
      cy
    );

    stimCtx.fillText(
      rfType === "onCenter" ? "-" : "+",
      cx + 60,
      cy
    );
  }

  if (rfType === "simple") {

    stimCtx.save();
    stimCtx.translate(cx, cy);
    stimCtx.rotate(RF_ORIENTATION);

    // Left OFF region
    stimCtx.fillStyle = "rgba(255,0,0,0.3)";
    stimCtx.fillRect(-90, -40, 60, 80);

    // Center ON region
    stimCtx.fillStyle = "rgba(0,255,0,0.3)";
    stimCtx.fillRect(-30, -40, 60, 80);

    // Right OFF region
    stimCtx.fillStyle = "rgba(255,0,0,0.3)";
    stimCtx.fillRect(30, -40, 60, 80);

    // Labels
    stimCtx.fillStyle = "white";

    stimCtx.fillText("-", -60, 0);
    stimCtx.fillText("+", 0, 0);
    stimCtx.fillText("-", 60, 0);

    stimCtx.restore();
  }
}

function isInsideStimulus(x, y) {
  const stimType = document.getElementById("stimType").value;
  const size = parseInt(document.getElementById("sizeSlider").value);
  const angle = document.getElementById("angleSlider").value * Math.PI/180;

  const dx = x - mouse.x;
  const dy = y - mouse.y;

  if (stimType === "spot") {
    return (dx*dx + dy*dy) <= size*size;
  }

  if (stimType === "bar") {
    // rotate point into bar coordinates
    const xr = dx * Math.cos(-angle) - dy * Math.sin(-angle);
    const yr = dx * Math.sin(-angle) + dy * Math.cos(-angle);

    return Math.abs(xr) < size && Math.abs(yr) < 6;
  }

  return false;
}

function loop() {

  const rfType = document.getElementById("rfType").value;
  const cx = STIM_SIZE / 2;
  const cy = STIM_SIZE / 2;

  drawStimulus();
  drawReceptiveField(rfType,cx,cy);

  const rate = computeResponse(rfType,cx,cy,mouse);
  updateSpikes(rate);
  drawSpikes();

  requestAnimationFrame(loop);
}

loop();

</script>

</body>
</html>
