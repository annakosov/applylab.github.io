# Render Blueprint: New -> Blueprint -> select the repo containing this file.
# Deploys the visual search backend as a web service.
#
# This default config has NO persistent disk, so it works on the free plan --
# but sessions.json resets on every restart/redeploy/idle-spindown.
#
# To retain data across restarts, upgrade the service to a paid instance type
# and uncomment the "disk" block and DATA_DIR envVar below. Persistent disks
# are not available on the free plan; attaching one there is what caused the
# "EACCES: permission denied, mkdir '/data'" error.

services:
  - type: web
    name: visual-search-backend
    rootDir: PSY270
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: ALLOWED_ORIGIN
        value: "*"   # tighten to your GitHub Pages origin once deployed, e.g. https://yourname.github.io
      # - key: DATA_DIR
      #   value: /data
    # disk:
    #   name: visual-search-data
    #   mountPath: /data
    #   sizeGB: 1
