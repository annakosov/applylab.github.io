<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Visual Search Experiment</title>

<!-- jsPsych core + plugins -->
<script src="https://unpkg.com/jspsych@7.3.4"></script>
<script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3"></script>
<link rel="stylesheet" href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css">

<!-- Chart.js for the results plot -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f4f4f4;
  }
  .fixation {
    font-size: 48px;
    color: #333;
  }
  #results-screen {
    max-width: 900px;
    margin: 30px auto;
    background: #fff;
    padding: 24px 32px;
    border-radius: 8px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.15);
  }
  #results-screen h2 { margin-top: 0; }
  .charts-row { display: flex; gap: 20px; flex-wrap: wrap; }
  .chart-panel {
    flex: 1 1 360px;
    border: 1px solid #ccc;
    border-radius: 6px;
    padding: 16px;
  }
  .chart-wrap { position: relative; height: 360px; }
  #jspsych-progressbar-container { display: none; }
</style>
</head>
<body>

<!-- type="module" so we can `import` the Firebase SDK below -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, addDoc, getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ============================================================
   CONFIG
   ============================================================ */
const SET_SIZES = [4, 8, 16, 32];
const TYPES = ['feature', 'conjunction'];
const PRESENCE = ['present', 'absent'];
const REPS_PER_CONDITION = 1;  // trials per condition (16 conditions * 10 = 160 test trials)
const N_PRACTICE_TRIALS = 4;
const DISPLAY_SIZE = 520;       // px, square search area
const GRID_COLS = 8;
const GRID_ROWS = 8;
const ITEM_SIZE = 30;           // px
const TRIAL_TIMEOUT = 8000;     // ms
const FEEDBACK_DURATION = 600;  // ms
const GROUP_DATA_KEY = 'vs_experiment_group_data'; // localStorage fallback key
const SESSIONS_COLLECTION = 'visual_search_sessions'; // Firestore collection name

// Colourblind-friendly palette (Okabe-Ito)
const COLOR_TARGET = '#0072B2';      // blue -- target stimulus, "present" data series
const COLOR_DISTRACTOR = '#E69F00';  // orange -- distractor stimulus, "absent" data series
const COLOR_INCORRECT = '#D55E00';   // vermillion -- incorrect feedback

// Fill this in with your own project's config (Firebase console -> Project
// settings -> General -> Your apps -> SDK setup and configuration -> Config).
// Leave apiKey as the placeholder to fall back to browser localStorage only.
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};

let db = null;
if (firebaseConfig.apiKey && firebaseConfig.apiKey !== "YOUR_API_KEY") {
  try {
    const firebaseApp = initializeApp(firebaseConfig);
    db = getFirestore(firebaseApp);
  } catch (err) {
    console.warn('Firebase failed to initialize, falling back to localStorage:', err);
  }
}

let testTrialsCompleted = 0;
const TOTAL_TEST_TRIALS = TYPES.length * PRESENCE.length * SET_SIZES.length * REPS_PER_CONDITION;

const jsPsych = initJsPsych({
  show_progress_bar: true,
  auto_update_progress_bar: false,
  message_progress_bar: 'Progress',
  on_finish: async function () {
    document.body.innerHTML = '<p style="text-align:center;margin-top:60px;font-size:16px;">Calculating your results...</p>';
    const sessionSummary = summarize(jsPsych.data.get());
    const { sessions: allSessions, source } = await saveAndFetchAllSessions(sessionSummary);
    console.log(`Stored sessions: ${allSessions.length} (including this one, source: ${source})`);
    const groupAvg = groupAverages(allSessions);
    renderResults(sessionSummary, groupAvg, allSessions.length, source);
  }
});

// Log how many sessions are already stored, before this session starts.
async function logStoredSessionCount() {
  try {
    let count;
    let source;
    if (db) {
      const snapshot = await getDocs(collection(db, SESSIONS_COLLECTION));
      count = snapshot.size;
      source = 'firebase';
    } else {
      count = loadGroupData().length;
      source = 'localStorage';
    }
    console.log(`Previously stored sessions: ${count} (source: ${source})`);
  } catch (err) {
    console.warn('Could not fetch stored session count:', err);
  }
}
logStoredSessionCount();

/* ============================================================
   HELPERS
   ============================================================ */
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Build the HTML for one search display and return it plus the correct key
function generateDisplay(type, presence, setSize) {
  const cellW = DISPLAY_SIZE / GRID_COLS;
  const cellH = DISPLAY_SIZE / GRID_ROWS;
  const totalCells = GRID_COLS * GRID_ROWS;

  const cellIndices = shuffle([...Array(totalCells).keys()]).slice(0, setSize);

  const distractorCount = presence === 'present' ? setSize - 1 : setSize;
  let items = [];

  if (type === 'feature') {
    // Distractors differ from the target by color only (all orange circles) -> pop-out
    for (let i = 0; i < distractorCount; i++) items.push({ shape: 'circle', color: COLOR_DISTRACTOR });
  } else {
    // Conjunction: distractors share color OR shape with the target, never both
    const halfA = Math.ceil(distractorCount / 2);
    const halfB = distractorCount - halfA;
    for (let i = 0; i < halfA; i++) items.push({ shape: 'circle', color: COLOR_DISTRACTOR }); // orange circles
    for (let i = 0; i < halfB; i++) items.push({ shape: 'square', color: COLOR_TARGET });      // blue squares
  }

  if (presence === 'present') items.push({ shape: 'circle', color: COLOR_TARGET, isTarget: true });

  items = shuffle(items);

  let html = `<div style="position:relative;width:${DISPLAY_SIZE}px;height:${DISPLAY_SIZE}px;margin:0 auto;">`;
  items.forEach((item, i) => {
    const cellIndex = cellIndices[i];
    const col = cellIndex % GRID_COLS;
    const row = Math.floor(cellIndex / GRID_COLS);
    const jitterX = Math.random() * 14 - 7;
    const jitterY = Math.random() * 14 - 7;
    const left = col * cellW + cellW / 2 - ITEM_SIZE / 2 + jitterX;
    const top = row * cellH + cellH / 2 - ITEM_SIZE / 2 + jitterY;
    const radius = item.shape === 'circle' ? '50%' : '0';
    html += `<div style="position:absolute;left:${left}px;top:${top}px;width:${ITEM_SIZE}px;height:${ITEM_SIZE}px;background:${item.color};border-radius:${radius};"></div>`;
  });
  html += `</div>
    <p style="margin-top:18px;font-size:16px;">Press <b>&larr;</b> if the <span style="color:${COLOR_TARGET};">blue circle</span> is absent &nbsp;|&nbsp; <b>&rarr;</b> if it is present</p>`;

  return html;
}

/* ============================================================
   TIMELINE
   ============================================================ */
const timeline = [];

timeline.push({
  type: jsPsychHtmlKeyboardResponse,
  stimulus: `
    <div style="max-width:600px;margin:0 auto;text-align:left;">
      <h2>Visual Search Task</h2>
      <p>On each trial you will briefly see a display of shapes. Your job is to decide,
      as quickly and accurately as possible, whether a <b style="color:${COLOR_TARGET};">blue circle</b>
      is present among the other shapes.</p>
      <p>Press the <b>right arrow</b> if the blue circle is <b>present</b>.<br>
      Press the <b>left arrow</b> if the blue circle is <b>absent</b>.</p>
      <p>You'll start with a short practice block of ${N_PRACTICE_TRIALS} trials, then move on
      to the main experiment (${TOTAL_TEST_TRIALS} trials).</p>
      <p>Press the spacebar to begin the practice block.</p>
    </div>`,
  choices: [' ']
});

function sampleConditionPool() {
  const all = [];
  TYPES.forEach(type => PRESENCE.forEach(presence => SET_SIZES.forEach(setSize => all.push({ type, presence, setSize }))));
  return all;
}

// Practice conditions: a random sample across the condition space
const practiceConditions = shuffle(sampleConditionPool()).slice(0, N_PRACTICE_TRIALS)
  .map(c => Object.assign({ phase: 'practice' }, c));

// Test conditions: full factorial, repeated, shuffled
let testConditions = [];
TYPES.forEach(type => {
  PRESENCE.forEach(presence => {
    SET_SIZES.forEach(setSize => {
      for (let r = 0; r < REPS_PER_CONDITION; r++) {
        testConditions.push({ type, presence, setSize, phase: 'test' });
      }
    });
  });
});
testConditions = shuffle(testConditions);

const fixation = {
  type: jsPsychHtmlKeyboardResponse,
  stimulus: '<div class="fixation">+</div>',
  choices: "NO_KEYS",
  trial_duration: 500
};

const search_trial = {
  type: jsPsychHtmlKeyboardResponse,
  stimulus: function () {
    const tv = jsPsych.timelineVariable;
    return generateDisplay(tv('type'), tv('presence'), tv('setSize'));
  },
  choices: ['arrowleft', 'arrowright'],
  trial_duration: TRIAL_TIMEOUT,
  data: function () {
    const tv = jsPsych.timelineVariable;
    return { task: 'search', type: tv('type'), presence: tv('presence'), setSize: tv('setSize'), phase: tv('phase') };
  },
  on_finish: function (data) {
    const correctKey = data.presence === 'present' ? 'arrowright' : 'arrowleft';
    data.correct = data.response === correctKey;
    if (data.phase === 'test') {
      testTrialsCompleted++;
      jsPsych.setProgressBar(testTrialsCompleted / TOTAL_TEST_TRIALS);
    }
  }
};

const feedback_trial = {
  type: jsPsychHtmlKeyboardResponse,
  stimulus: function () {
    const last = jsPsych.data.get().last(1).values()[0];
    if (last.response === null) {
      return `
        <div style="max-width:500px;margin:0 auto;">
          <p style="font-size:22px;color:#b8860b;">You timed out on this trial</p>
          <p>Press the spacebar to continue to the next trial.</p>
        </div>`;
    }
    return last.correct
      ? `<p style="font-size:22px;color:${COLOR_TARGET};">Correct</p>`
      : `<p style="font-size:22px;color:${COLOR_INCORRECT};">Incorrect</p>`;
  },
  choices: function () {
    const last = jsPsych.data.get().last(1).values()[0];
    return last.response === null ? [' '] : "NO_KEYS";
  },
  trial_duration: function () {
    const last = jsPsych.data.get().last(1).values()[0];
    return last.response === null ? null : FEEDBACK_DURATION;
  }
};

// Practice block
timeline.push({
  timeline: [fixation, search_trial, feedback_trial],
  timeline_variables: practiceConditions
});

timeline.push({
  type: jsPsychHtmlKeyboardResponse,
  stimulus: `
    <div style="max-width:600px;margin:0 auto;text-align:left;">
      <h2>Practice complete</h2>
      <p>Now the main experiment begins (${TOTAL_TEST_TRIALS} trials). Feedback will still be shown
      after each trial. Respond as quickly and accurately as you can.</p>
      <p>A progress bar will now appear above the display to show how far through the experiment you are.</p>
      <p>Press the spacebar to begin.</p>
    </div>`,
  choices: [' '],
  on_load: function () {
    const bar = document.querySelector('#jspsych-progressbar-container');
    if (bar) bar.style.display = 'block';
  }
});

// Main test block
timeline.push({
  timeline: [fixation, search_trial, feedback_trial],
  timeline_variables: testConditions
});

timeline.push({
  type: jsPsychHtmlKeyboardResponse,
  stimulus: '<p>You have finished the task. Calculating your results...</p>',
  choices: "NO_KEYS",
  trial_duration: 1000
});

jsPsych.run(timeline);

/* ============================================================
   RESULTS
   ============================================================ */
function summarize(dataCollection) {
  // mean RT for each of the 16 conditions, correct trials only.
  // Timed-out trials (response === null) are excluded -- they're marked
  // correct: false in on_finish, so the correct:true filter already omits them.
  const summary = [];
  TYPES.forEach(type => {
    PRESENCE.forEach(presence => {
      SET_SIZES.forEach(setSize => {
        const trials = dataCollection.filter({ task: 'search', phase: 'test', type, presence, setSize, correct: true });
        const n = trials.count();
        const meanRT = n > 0 ? trials.select('rt').mean() : null;
        summary.push({ type, presence, setSize, meanRT, n });
      });
    });
  });
  return summary;
}

function loadGroupData() {
  try {
    return JSON.parse(localStorage.getItem(GROUP_DATA_KEY) || '[]');
  } catch (e) {
    return [];
  }
}

function saveSessionToGroupData(sessionSummary) {
  const all = loadGroupData();
  all.push({ timestamp: Date.now(), summary: sessionSummary });
  localStorage.setItem(GROUP_DATA_KEY, JSON.stringify(all));
  return all;
}

// Write this session to Firestore, then read every stored session back for
// the group average. Falls back to localStorage if Firebase isn't configured
// or a read/write fails. Returns { sessions, source }.
async function saveAndFetchAllSessions(sessionSummary) {
  if (db) {
    try {
      await addDoc(collection(db, SESSIONS_COLLECTION), {
        timestamp: Date.now(),
        summary: sessionSummary
      });
      const snapshot = await getDocs(collection(db, SESSIONS_COLLECTION));
      const sessions = snapshot.docs.map(doc => doc.data());
      return { sessions, source: 'firebase' };
    } catch (err) {
      console.warn('Firebase read/write failed, falling back to localStorage:', err);
    }
  }
  return { sessions: saveSessionToGroupData(sessionSummary), source: 'localStorage' };
}

function groupAverages(allSessions) {
  // average meanRT per condition across all stored sessions (including current)
  const buckets = {};
  allSessions.forEach(sess => {
    sess.summary.forEach(row => {
      if (row.meanRT === null) return;
      const key = `${row.type}-${row.presence}-${row.setSize}`;
      if (!buckets[key]) buckets[key] = [];
      buckets[key].push(row.meanRT);
    });
  });
  const avg = {};
  Object.keys(buckets).forEach(key => {
    avg[key] = buckets[key].reduce((a, b) => a + b, 0) / buckets[key].length;
  });
  return avg;
}

function renderResults(sessionSummary, groupAvg, nSessions, source) {
  document.body.innerHTML = `
    <div id="results-screen">
      <h1>Your Results</h1>
      <div class="charts-row">
        <div class="chart-panel">
          <h2>Feature Search</h2>
          <div class="chart-wrap"><canvas id="chart-feature"></canvas></div>
        </div>
        <div class="chart-panel">
          <h2>Conjunction Search</h2>
          <div class="chart-wrap"><canvas id="chart-conjunction"></canvas></div>
        </div>
      </div>
    </div>
  `;

  const sharedYMax = computeSharedYMax(sessionSummary, groupAvg);
  drawChart('chart-feature', 'feature', sessionSummary, groupAvg, nSessions, sharedYMax);
  drawChart('chart-conjunction', 'conjunction', sessionSummary, groupAvg, nSessions, sharedYMax);
}

// So both panels share the same y-axis scale, find the largest value that
// will appear across either chart and round up a bit of headroom.
function computeSharedYMax(sessionSummary, groupAvg) {
  const values = [];
  sessionSummary.forEach(r => { if (r.meanRT !== null) values.push(r.meanRT); });
  Object.values(groupAvg).forEach(v => values.push(v));
  const max = values.length ? Math.max(...values) : 1000;
  return Math.ceil((max * 1.1) / 100) * 100;
}

function drawChart(canvasId, type, sessionSummary, groupAvg, nSessions, yMax) {
  const getVals = (presence, source) => SET_SIZES.map(setSize => {
    if (source === 'session') {
      const row = sessionSummary.find(r => r.type === type && r.presence === presence && r.setSize === setSize);
      return row && row.meanRT !== null ? Math.round(row.meanRT) : null;
    } else {
      const key = `${type}-${presence}-${setSize}`;
      return groupAvg[key] !== undefined ? Math.round(groupAvg[key]) : null;
    }
  });

  new Chart(document.getElementById(canvasId), {
    type: 'bar',
    data: {
      labels: SET_SIZES,
      datasets: [
        { label: 'You — Present', data: getVals('present', 'session'), backgroundColor: COLOR_TARGET },
        { label: 'You — Absent', data: getVals('absent', 'session'), backgroundColor: COLOR_DISTRACTOR },
        { label: `Class Average — Present (Size: ${nSessions})`, data: getVals('present', 'group'), backgroundColor: 'rgba(0,114,178,0.35)' },
        { label: `Class Average — Absent (Size: ${nSessions})`, data: getVals('absent', 'group'), backgroundColor: 'rgba(230,159,0,0.35)' }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          labels: { font: { size: 14 } }
        }
      },
      scales: {
        x: {
          title: { display: true, text: 'Set size', font: { size: 15 } },
          ticks: { font: { size: 13 } }
        },
        y: {
          title: { display: true, text: 'Reaction time (ms)', font: { size: 15 } },
          ticks: { font: { size: 13 } },
          beginAtZero: true,
          max: yMax
        }
      }
    }
  });
}
</script>
</body>
</html>
